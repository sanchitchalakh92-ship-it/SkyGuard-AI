project:
  name: "SkyGuard AI"
  title: "Intelligent Real-Time Anomaly Detection System for AWS"
  problem_statement: "SIH 26073 - Ministry of Earth Sciences (MoES) / IMD"
  version: "1.0.0"

thresholds:
  wmo_physical_limits:
    temperature:
      min: -40.0
      max: 60.0
    pressure:
      min: 500.0
      max: 1085.0
    humidity:
      min: 0.0
      max: 100.0
  rate_of_change:
    temperature_max_step_1h: 6.0    # °C per hour
    pressure_max_step_1h: 4.0       # hPa per hour (thunderstorm/cyclone can have ~3-4)
    humidity_max_step_1h: 35.0      # % per hour
  persistence:
    max_identical_steps: 6          # 6 consecutive identical readings flags frozen sensor
    epsilon: 0.001
  physics:
    lapse_rate_c_per_km: 6.5
    barometric_scale_height_m: 8434.5
    sea_level_standard_pressure_hpa: 1013.25

ensemble:
  weights:
    rules: 0.25
    temporal: 0.25
    multivariate: 0.25
    spatial: 0.25
  alert_thresholds:
    low: 0.40
    medium: 0.65
    high: 0.85
    critical: 0.95
  hysteresis_cooldown_minutes: 15

health:
  initial_score: 100.0
  drift_cusum_threshold: 4.5
  frozen_penalty: 15.0
  spike_penalty: 5.0
  missing_penalty: 10.0
  recovery_rate_per_hour: 2.0

