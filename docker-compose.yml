version: '3.8'

services:
  skyguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyguard_backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEFAULT_DATA_SOURCE=simulator
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped
